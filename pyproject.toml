[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cc-probe"
version = "0.1.0"
description = "Show the builtin macros and include paths of a GCC-family compiler"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"

[project.scripts]
cc-probe = "cc_probe.cli:main"

[tool.setuptools]
packages = ["cc_probe"]
